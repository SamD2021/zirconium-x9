# Use case Configuration for the ThinkPad X9 combined speaker topology
#
# Fedora's generic profile routes the CS42L43 speaker inputs but does not
# explicitly open their digital gate.  The four CS35L56 smart-amp paths then
# play while the CS42L43-driven stereo pair remains silent.  Keep this in the
# Speaker device sequence so headphone switching and session mute still own
# the output lifecycle.

SectionDevice."Speaker" {
	Comment "Speaker"

	If.hs_present {
		Condition {
			Type String
			Haystack "${var:HeadsetCodec1}"
			Needle "cs42l43"
		}
		True.ConflictingDevice [
			"Headphones"
		]
	}

	EnableSequence [
		cset "name='cs42l43 Speaker L Input 1' 'DP6RX1'"
		cset "name='cs42l43 Speaker R Input 1' 'DP6RX2'"
		cset "name='cs42l43 Speaker Digital Volume' 128"
		cset "name='cs42l43 Speaker Digital Switch' 1"
	]

	DisableSequence [
		cset "name='cs42l43 Speaker Digital Switch' 0"
		cset "name='cs42l43 Speaker L Input 1' 'None'"
		cset "name='cs42l43 Speaker R Input 1' 'None'"
	]

	If.0 {
		Condition {
			Type String
			Empty "${var:-@OutMix>0dB}"
		}
		True.Value {
			PlaybackMixer "default:${CardId}"
			PlaybackMixerElem "cs42l43 Speaker"
		}
		False.Value {
			PlaybackMixerElem "cs42l43 Speaker Digital"
		}
	}

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
