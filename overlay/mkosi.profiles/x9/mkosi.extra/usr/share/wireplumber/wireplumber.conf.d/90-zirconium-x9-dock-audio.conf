# Keep the dock's analog jack available without letting it automatically
# replace the X9's built-in speakers when the dock is connected.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output[.]usb-Lenovo_ThinkPad_Thunderbolt_4_Dock_USB_Audio_.*[.]analog-stereo$"
      }
    ]
    actions = {
      update-props = {
        priority.session = 500
      }
    }
  }
]
